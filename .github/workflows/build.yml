name: build-ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Development-signed build: the Meta SDK's Wi-Fi video link needs two entitlements
      # that only a paid Apple Developer team can grant (see README).
      - name: Install signing certificate and profile
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d" && cp "$RUNNER_TEMP/profile.mobileprovision" "$d/$UUID.mobileprovision"
          done
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Installed profile '$NAME' ($UUID)"

      - name: Archive (signed)
        run: |
          xcodebuild archive \
            -project MetaStream.xcodeproj \
            -scheme MetaStream \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MetaStream.xcarchive \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Development" \
            DEVELOPMENT_TEAM="${{ secrets.TEAM_ID }}" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            META_APP_ID="${{ secrets.META_APP_ID }}" CLIENT_TOKEN="${{ secrets.CLIENT_TOKEN }}" TEAM_ID="${{ secrets.TEAM_ID }}" \
            KICK_CLIENT_ID="${{ secrets.KICK_CLIENT_ID }}" KICK_CLIENT_SECRET="${{ secrets.KICK_CLIENT_SECRET }}" TWITCH_CLIENT_ID="${{ secrets.TWITCH_CLIENT_ID }}" \
            RESTREAM_CLIENT_ID="${{ secrets.RESTREAM_CLIENT_ID }}" RESTREAM_CLIENT_SECRET="${{ secrets.RESTREAM_CLIENT_SECRET }}" YOUTUBE_CLIENT_ID="${{ secrets.YOUTUBE_CLIENT_ID }}"

      - name: Package IPA
        run: |
          codesign -d --entitlements - build/MetaStream.xcarchive/Products/Applications/MetaStream.app
          mkdir -p build/Payload && cp -R build/MetaStream.xcarchive/Products/Applications/MetaStream.app build/Payload/ && (cd build && zip -qry MetaStream.ipa Payload)

      # Public repo: anyone with a GitHub account can download artifacts, and the IPA embeds OAuth client
      # secrets. Encrypt it; decrypt locally with signing/ipa-password.txt (see README).
      - name: Encrypt IPA
        env:
          IPA_PASSWORD: ${{ secrets.IPA_PASSWORD }}
        run: openssl enc -aes-256-cbc -pbkdf2 -salt -in build/MetaStream.ipa -out build/MetaStream.ipa.enc -pass env:IPA_PASSWORD

      - uses: actions/upload-artifact@v7
        with:
          name: MetaStream-ipa
          path: build/MetaStream.ipa.enc
          retention-days: 1
