name: MetaStream
options:
  bundleIdPrefix: com.saeedkolivand
  deploymentTarget:
    iOS: "17.2"
  xcodeVersion: "26.4"
packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 0.9.0
  HaishinKit:
    url: https://github.com/HaishinKit/HaishinKit.swift
    from: 2.1.0
targets:
  MetaStream:
    type: application
    platform: iOS
    sources: [MetaStream]
    # ponytail: hand-written Info.plist (MWDAT keys, URL scheme, etc.) — INFOPLIST_FILE
    # instead of the `info:` key, since `info.path` makes XcodeGen regenerate/overwrite
    # the plist from `info.properties` on every `xcodegen generate`.
    settings:
      base:
        INFOPLIST_FILE: MetaStream/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.saeedkolivand.metastream
        ARCHS: arm64
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        META_APP_ID: ""
        CLIENT_TOKEN: ""
        TEAM_ID: ""
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_ENTITLEMENTS: MetaStream/MetaStream.entitlements   # Wi-Fi entitlements the Meta SDK needs for video
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: RTMPHaishinKit
